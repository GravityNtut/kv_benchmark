receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: nats_exporter
          scrape_interval: 10s
          static_configs:
            - targets: ["nats_exporter:7777"]

processors:
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus]
