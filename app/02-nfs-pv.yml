---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-config
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /nfs-for-test/config
    server: 172.16.168.2
  storageClassName: nfs-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc-config
  namespace: ns-benchmark
spec:
  volumeName: nfs-pv-config
  accessModes:
    - ReadWriteOnce
  resources: 
    requests:
      storage: 1Gi
  storageClassName: nfs-config