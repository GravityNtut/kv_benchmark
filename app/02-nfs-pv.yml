---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-0
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /nfs-for-test
    server: 172.16.168.2
  storageClassName: nfs-storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
